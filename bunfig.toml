[install]
linkWorkspacePackages = false
# Only install package versions published at least 7 days ago
minimumReleaseAge = 604800
minimumReleaseAgeExcludes = [
  # Our own package; apps bump it right after each publish.
  "@usenotra/geo",
  # c15t 3.0.0 for Notra Sites consent; prune once aged past 2026-10-19.
  "@c15t/astro",
  "@c15t/core",
  "@c15t/dev-tools",
  "@c15t/iab",
  "@c15t/react",
  "@c15t/schema",
  "@c15t/svelte",
  "@c15t/translations",
  "@c15t/ui",
]
