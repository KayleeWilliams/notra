modules:
  https_2xx:
    prober: http
    timeout: 10s
    http:
      method: GET
      preferred_ip_protocol: ip4
      follow_redirects: true
      fail_if_not_ssl: true
      tls_config:
        insecure_skip_verify: false
  api_ping:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_status_codes: [200]
      preferred_ip_protocol: ip4
      follow_redirects: false
      fail_if_not_ssl: true
      body_size_limit: 128KB
      fail_if_body_not_matches_regexp: ['^pong$']
      tls_config:
        insecure_skip_verify: false
  api_workspace:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_status_codes: [200]
      preferred_ip_protocol: ip4
      follow_redirects: false
      fail_if_not_ssl: true
      body_size_limit: 128KB
      authorization:
        type: Bearer
        credentials_file: /tmp/notra-probe/api-key
      fail_if_header_not_matches:
        - header: Content-Type
          regexp: '^application/json(?:;.*)?$'
      fail_if_body_json_not_matches_cel: 'body.currentWorkspace.id != "" && body.authentication.type == "apiKey" && body.workspaces.exists(w, w.id == body.currentWorkspace.id && w.isCurrent == true && w.status == "active")'
      tls_config:
        insecure_skip_verify: false
