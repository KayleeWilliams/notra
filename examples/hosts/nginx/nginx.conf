# Template for the official nginx image. On start, the image runs envsubst on
# /etc/nginx/templates/*.template and writes the result to /etc/nginx/conf.d/,
# so ${NOTRA_SITE_ORIGIN} becomes your Notra address, like
# https://stonebridge-nginx.notra.site. nginx's own $variables are left alone.

server {
    listen 80;
    server_name _;

    # Stonebridge's own website.
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ =404;
    }

    # /blog, /blog/*, /changelog and /changelog/* go to Notra with the path
    # unchanged. Same as the four locations in the Notra nginx guide, and it
    # doesn't match look-alikes such as /blogroll.
    location ~ ^/(blog|changelog)(/|$) {
        # No path after the origin, so /blog/launch goes to <origin>/blog/launch.
        proxy_pass ${NOTRA_SITE_ORIGIN};

        # Notra finds the site by its host. $proxy_host is the host from
        # proxy_pass (stonebridge-nginx.notra.site), which overrides any
        # "proxy_set_header Host $host;" set at the http or server level.
        proxy_set_header Host $proxy_host;
        proxy_ssl_server_name on;

        # Site analytics tells visitors and countries apart by IP. Overwrite
        # the header so visitors can't send their own. Behind a CDN, set the
        # real IP first with the realip module.
        proxy_set_header X-Forwarded-For $remote_addr;

        # Notra doesn't need your visitors' sessions.
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
    }
}
